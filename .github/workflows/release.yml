name: Release PWA
on:
  workflow_dispatch:
    inputs:
      release_id:
        description: 'Release ID, e.g. 2026.10.19.1 (Asia/Taipei)'
        required: true
        type: string
      mobile_verified:
        description: 'Candidate tested on installed Android Chrome and iOS Safari PWA'
        required: true
        type: boolean
permissions:
  contents: read
concurrency:
  group: pwa-production-release
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/main' && inputs.mobile_verified
    runs-on: ubuntu-latest
    env:
      RELEASE_ID: ${{ inputs.release_id }}
      FORMAL_RELEASE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Verify and test the exact artifact to publish
        run: npm run release
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ inputs.release_id }}
          path: dist/
          include-hidden-files: true
          retention-days: 90
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-test-results
          path: .release-tests/results.json
          include-hidden-files: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
      contents: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Reject outdated queued commits
        uses: actions/github-script@v7
        with:
          script: |
            const {data} = await github.rest.repos.getBranch({...context.repo, branch: 'main'});
            if (data.commit.sha !== context.sha) core.setFailed('main changed; validate and release the latest commit.');
      - uses: actions/deploy-pages@v4
        id: deployment
  record:
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_ID: ${{ inputs.release_id }}
    steps:
      - name: Record deployed release ID and commit
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.git.createRef({
              ...context.repo, ref: `refs/tags/pwa-${process.env.RELEASE_ID}`, sha: context.sha
            });
            await core.summary.addHeading(`PWA ${process.env.RELEASE_ID}`)
              .addRaw(`Commit: ${context.sha}\n\nComplete the production-device checklist in docs/release/sop.md.`).write();
