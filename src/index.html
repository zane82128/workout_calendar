<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Workout Calendar</title>
    <meta name="theme-color" content="#303940">
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <div class="app" id="app-root">
      <header><div class="brand"><span class="pixel-emblem" aria-hidden="true"></span><h1>Workout Calendar</h1><span class="pixel-barbell" aria-hidden="true"></span></div><button id="open-settings" type="button" aria-haspopup="dialog">設定</button></header>
      <div id="app-navigation">
      <nav role="tablist" aria-label="主要功能">
        <button type="button" id="record-tab" role="tab" data-page="record" aria-selected="true" aria-controls="record-page">紀錄</button>
        <button type="button" id="tasks-tab" role="tab" data-page="tasks" aria-selected="false" aria-controls="tasks-page">動作管理</button>
      </nav>
      <button id="update-shortcut" type="button" hidden>新版本已準備好 · 查看</button>
      </div>
      <div id="app-error" role="alert" hidden><span id="error-text"></span><button type="button" id="retry-storage">重試讀取</button></div>
      <main>
        <section id="record-page" role="tabpanel" aria-labelledby="record-tab">
          <div class="row date-row"><h2 id="date-title">今天</h2><input id="schedule-date-input" type="date" aria-label="訓練日期" required></div>
          <details id="calendar-panel">
            <summary>日曆</summary>
            <div class="row calendar-nav"><button type="button" id="calendar-prev" aria-label="上一週">‹</button><span id="calendar-month"></span><button type="button" id="go-today">今天</button><button type="button" id="calendar-next" aria-label="下一週">›</button></div>
            <div class="weekdays" aria-hidden="true"><span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span></div>
            <div id="calendar-days" class="calendar-days" aria-label="四週日曆"></div>
            <p class="muted legend"><span>● 已完成（橘）</span><span>▰ 舊紀錄（灰）</span></p>
          </details>
          <section class="section" aria-label="記錄重量">
            <div class="row exercise-picker-heading"><h2>動作</h2><button id="open-exercise-picker" type="button" aria-haspopup="dialog">選擇動作</button></div>
            <p id="selected-exercise" class="selected-exercise"></p>
            <select id="exercise-select" aria-label="目前動作" hidden></select><select id="exercise-category-filter" hidden aria-label="舊版分類狀態"></select>
            <div class="comparison"><div><span class="muted">上次</span><strong id="last-weight">尚無紀錄</strong><span class="muted" id="last-date"></span></div><div><span class="muted">歷史最高</span><strong id="highest-weight">尚無紀錄</strong><span id="current-weight" class="muted">當天最高：—</span></div></div>
            <label for="entry-weight">本次重量</label>
            <form id="complete-form" class="weight-row" novalidate><input id="entry-weight" type="number" min="0" step="any" inputmode="decimal" placeholder="徒手填 0" aria-label="本次實際完成最高重量" required><select id="entry-unit" aria-label="本次重量單位"><option value="kg">kg</option><option value="lb">lb</option></select><button type="submit" class="primary" id="complete-button">完成</button></form>
            <p id="entry-error" role="alert" class="error" hidden></p>
          </section>
          <details class="section" id="daily-set-panel"><summary>加入訓練組合</summary><p id="daily-set-hint" class="muted">先到動作管理 → 訓練組合建立組合。</p><form id="daily-set-form" class="row"><select id="daily-set-select" class="grow" aria-label="訓練組合"></select><button id="daily-set-add" type="submit">加入今天</button></form><p class="muted">只加入待做清單，逐項完成才算紀錄。</p><p id="daily-set-status" role="status"></p></details>
          <section class="section" id="pending-section" hidden><h2>待做</h2><div id="pending-list"></div></section>
          <section class="section" aria-label="所選日期紀錄"><h2>已完成</h2><div id="completed-list"></div></section>
          <section class="section" id="legacy-section" hidden><h2>舊版紀錄 · 只供查閱</h2><div id="legacy-list"></div><p class="muted">不納入上次與歷史最高比較</p></section>
          <details class="section" id="rest-panel"><summary>休息倒數</summary>
            <div class="timer-settings"><label for="rest-timer-minutes">分<input id="rest-timer-minutes" type="number" min="0" max="99" step="1" value="1"></label><label for="rest-timer-seconds">秒<input id="rest-timer-seconds" type="number" min="0" max="59" step="1" value="30"></label><output id="rest-timer-display" aria-label="休息剩餘時間">01:30</output></div>
            <div class="row actions"><button type="button" id="rest-timer-start">開始</button><button type="button" id="rest-timer-pause" disabled>暫停</button><button type="button" id="rest-timer-reset">重置</button></div>
          </details>
        </section>
        <section id="tasks-page" role="tabpanel" aria-labelledby="tasks-tab" hidden>
          <div class="row management-switch"><button id="manage-exercises" type="button" aria-pressed="true">動作清單</button><button id="manage-sets" type="button" aria-pressed="false">訓練組合</button></div>
          <div id="exercise-management">
          <details id="add-exercise-panel"><summary>＋新增動作</summary><form id="task-form" novalidate><label for="task-input">動作名稱</label><input id="task-input" required autocomplete="off" placeholder="動作名稱"><div class="row actions"><label class="grow" for="task-category">分類<select id="task-category"></select></label><button type="submit" class="primary">新增</button></div></form></details>
          <p id="task-error" role="alert" class="error" hidden></p><div id="task-list" class="section"></div>
          <details id="archived-panel"><summary>已封存的動作</summary><div id="archived-list"></div></details>
          </div>
          <section id="set-management" hidden><h2>訓練組合</h2><form id="set-form" novalidate><label for="set-name">組合名稱</label><input id="set-name" maxlength="40" placeholder="例如：推日" required><details id="set-choices-panel"><summary>選擇動作</summary><div id="set-choices"></div></details><p class="muted">依勾選順序加入，可上移調整。</p><div id="set-order"></div><div class="row actions"><button id="set-save" class="primary" type="submit">儲存組合</button><button id="set-cancel" type="button">取消編輯</button></div><p id="set-status" role="status"></p></form><div id="set-list" class="section"></div></section>
        </section>
      </main>
    </div>
    <dialog id="settings-panel" aria-labelledby="settings-title">
      <div class="row settings-heading"><h2 id="settings-title">設定</h2><button id="close-settings" type="button">關閉</button></div>
      <section class="settings-appearance"><label for="theme-select">外觀</label><select id="theme-select"><option value="system">跟隨系統</option><option value="light">淺色</option><option value="dark">深色</option></select><span id="theme-status" role="status" hidden></span></section>
      <section class="app-update" aria-label="版本與更新"><details id="update-panel"><summary>版本與更新</summary><span id="app-version"></span><button type="button" id="check-update">檢查更新</button><p id="update-status" role="status" aria-live="polite"></p><p id="update-note" hidden>更新會保留輸入與計時。</p><button type="button" id="apply-update" hidden>立即更新</button><button type="button" id="defer-update" hidden>稍後</button></details></section>
      <details class="section" id="feedback-panel">
          <summary>回報問題</summary>
          <form id="feedback-form" novalidate>
            <label for="feedback-title">主旨</label><input id="feedback-title" maxlength="80" required autocomplete="off" placeholder="最多 80 字">
            <label for="feedback-body">內容</label><textarea id="feedback-body" maxlength="2000" rows="5" required placeholder="請描述遇到的問題（最多 2000 字）"></textarea>
            <button class="primary" id="feedback-send" type="submit">送出回報</button>
            <p id="feedback-status" role="status" aria-live="polite"></p>
          </form>
        </details>
    </dialog>
    <div id="completion-toast" class="toast" role="status" aria-live="polite" hidden></div>
    <dialog id="exercise-picker" aria-labelledby="exercise-picker-title">
      <div class="row"><h2 id="exercise-picker-title">選擇動作</h2><button id="close-exercise-picker" type="button">關閉</button></div>
      <label for="exercise-search">搜尋動作</label><input id="exercise-search" type="search" placeholder="輸入名稱搜尋" autocomplete="off">
      <div id="exercise-picker-results"></div><p id="exercise-picker-empty" class="muted" hidden>沒有符合的動作</p>
    </dialog>
    <script src="main.js" type="module"></script>
  </body>
</html>
