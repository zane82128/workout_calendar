<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Workout Calendar</title>
    <meta name="theme-color" content="#303940">
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <div class="app" id="app-root">
      <header><div class="brand"><span class="pixel-emblem" aria-hidden="true"></span><h1>Workout Calendar</h1><span class="pixel-barbell" aria-hidden="true"></span></div><div class="appearance"><label for="theme-select">外觀</label><select id="theme-select"><option value="system">跟隨系統</option><option value="light">淺色</option><option value="dark">深色</option></select><span id="theme-status" role="status" hidden></span></div></header>
      <nav role="tablist" aria-label="主要功能">
        <button type="button" id="record-tab" role="tab" data-page="record" aria-selected="true" aria-controls="record-page">紀錄</button>
        <button type="button" id="tasks-tab" role="tab" data-page="tasks" aria-selected="false" aria-controls="tasks-page">動作管理</button>
      </nav>
      <div id="app-error" role="alert" hidden><span id="error-text"></span><button type="button" id="retry-storage">重試讀取</button></div>
      <main>
        <section id="record-page" role="tabpanel" aria-labelledby="record-tab">
          <div class="row date-row"><h2 id="date-title">今天</h2><input id="schedule-date-input" type="date" aria-label="訓練日期" required></div>
          <details id="calendar-panel">
            <summary>日曆</summary>
            <div class="row calendar-nav"><button type="button" id="calendar-prev" aria-label="上一週">‹</button><span id="calendar-month"></span><button type="button" id="go-today">今天</button><button type="button" id="calendar-next" aria-label="下一週">›</button></div>
            <div class="weekdays" aria-hidden="true"><span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span></div>
            <div id="calendar-days" class="calendar-days" aria-label="四週日曆"></div>
            <p class="muted legend"><span>● 已完成（橘）</span><span>▰ 舊紀錄（灰）</span></p>
          </details>
          <section class="section" aria-label="記錄重量">
            <label for="exercise-select">動作</label><select id="exercise-select"></select>
            <details id="filter-panel"><summary class="muted">篩選動作</summary><label for="exercise-category-filter">分類</label><select id="exercise-category-filter"></select><label for="exercise-search">搜尋</label><input id="exercise-search" type="search" placeholder="動作名稱"></details>
            <div class="comparison"><div><span class="muted">上次</span><strong id="last-weight">尚無紀錄</strong><span class="muted" id="last-date"></span></div><div><span class="muted">歷史最高</span><strong id="highest-weight">尚無紀錄</strong><span id="current-weight" class="muted">當天最高：—</span></div></div>
            <label for="entry-weight">本次重量</label>
            <form id="complete-form" class="weight-row" novalidate><input id="entry-weight" type="number" min="0" step="any" inputmode="decimal" placeholder="徒手填 0" aria-label="本次實際完成最高重量 kg" required><span>kg</span><button type="submit" class="primary" id="complete-button">完成</button></form>
            <p id="entry-error" role="alert" class="error" hidden></p>
          </section>
          <section class="section" aria-label="所選日期紀錄"><h2>已完成</h2><div id="completed-list"></div></section>
          <section class="section" id="legacy-section" hidden><h2>舊版紀錄 · 只供查閱</h2><div id="legacy-list"></div><p class="muted">不納入上次與歷史最高比較</p></section>
          <details class="section" id="rest-panel"><summary>休息倒數</summary>
            <div class="timer-settings"><label for="rest-timer-minutes">分<input id="rest-timer-minutes" type="number" min="0" max="99" step="1" value="1"></label><label for="rest-timer-seconds">秒<input id="rest-timer-seconds" type="number" min="0" max="59" step="1" value="30"></label><output id="rest-timer-display" aria-label="休息剩餘時間">01:30</output></div>
            <div class="row actions"><button type="button" id="rest-timer-start">開始</button><button type="button" id="rest-timer-pause" disabled>暫停</button><button type="button" id="rest-timer-reset">重置</button></div>
          </details>
        </section>
        <section id="tasks-page" role="tabpanel" aria-labelledby="tasks-tab" hidden>
          <h2>我的動作</h2><form id="task-form" novalidate><label for="task-input">新增動作</label><input id="task-input" required autocomplete="off" placeholder="動作名稱"><div class="row actions"><label class="grow" for="task-category">分類<select id="task-category"></select></label><button type="submit" class="primary">新增</button></div></form>
          <p id="task-error" role="alert" class="error" hidden></p><div id="task-list" class="section"></div>
          <details id="archived-panel"><summary>已封存的動作</summary><div id="archived-list"></div></details>
        </section>
      </main>
    </div>
    <footer class="app-update" aria-label="版本與更新"><details id="update-panel"><summary>版本與更新</summary><span id="app-version"></span><button type="button" id="check-update">檢查更新</button><p id="update-status" role="status" aria-live="polite"></p><p id="update-note" hidden>更新會保留輸入與計時。</p><button type="button" id="apply-update" hidden>立即更新</button><button type="button" id="defer-update" hidden>稍後</button></details></footer>
    <div id="completion-toast" class="toast" role="status" aria-live="polite" hidden></div>
    <script src="main.js" type="module"></script>
  </body>
</html>
